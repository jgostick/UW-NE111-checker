name: Student installation smoke test

on:
  push:
  workflow_dispatch:

jobs:
  install-and-launch:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: base
          auto-activate-base: true
          python-version: "3.14"

      - name: Confirm the Conda base environment
        shell: pwsh
        run: |
          conda info
          python -c "import sys; print(sys.executable)"

      - name: Install from GitHub archive and launch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCHIVE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "$ARCHIVE_URL"
          mkdir "$RUNNER_TEMP/ne111-work"
          cd "$RUNNER_TEMP/ne111-work"
          python -m ne111_checker A1 --headless --port 8501 > checker.log 2>&1 &
          checker_pid=$!
          trap 'kill "$checker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat checker.log
          exit 1

      - name: Install from GitHub archive and launch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir $env:ARCHIVE_URL
          $workdir = Join-Path $env:RUNNER_TEMP "ne111-work"
          New-Item -ItemType Directory -Path $workdir | Out-Null
          $stdout = Join-Path $workdir "checker.out"
          $stderr = Join-Path $workdir "checker.err"
          $process = Start-Process -FilePath python -WorkingDirectory $workdir -PassThru `
            -ArgumentList @("-m", "ne111_checker", "A1", "--headless", "--port", "8501") `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            foreach ($attempt in 1..30) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8501/_stcore/health"
                if ($response.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Seconds 1
            }
            Get-Content $stdout, $stderr
            throw "The checker did not start within 30 seconds."
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
