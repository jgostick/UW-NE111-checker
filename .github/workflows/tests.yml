name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  archive-install:
    name: Archive install and notebooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the GitHub archive without relying on Git
        shell: pwsh
        env:
          CHECKER_ARCHIVE: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: |
          python -m pip install --upgrade pip
          $checkerPython = (Get-Command python).Source
          $originalPath = $env:PATH
          $env:PATH = Split-Path -Parent $checkerPython
          try {
            & $checkerPython -c "import shutil; assert shutil.which('git') is None"
            if ($LASTEXITCODE -ne 0) { throw "Git is still available on PATH" }
            & $checkerPython -m pip install "$env:CHECKER_ARCHIVE"
            if ($LASTEXITCODE -ne 0) { throw "Archive installation failed" }
            & $checkerPython -m ne111_checker --help
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI could not start" }
          } finally {
            $env:PATH = $originalPath
          }
      - name: Run the installed A4/A5 checkers and regression tests
        shell: pwsh
        run: |
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed" }
          python -m pytest tests/test_inserted_letters.py tests/test_a3_a4_notebook_integration.py tests/test_a5_notebook_integration.py
          if ($LASTEXITCODE -ne 0) { throw "Notebook regression tests failed" }
          python scripts/smoke_a4.py
          if ($LASTEXITCODE -ne 0) { throw "A4 dashboard smoke test failed" }
          python scripts/smoke_a5.py
          if ($LASTEXITCODE -ne 0) { throw "A5 dashboard smoke test failed" }
