name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  archive-install:
    name: Archive install and submissions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the GitHub archive without relying on Git
        shell: pwsh
        env:
          CHECKER_ARCHIVE: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: |
          python -m pip install --upgrade pip
          $checkerPython = (Get-Command python).Source
          $originalPath = $env:PATH
          $env:PATH = Split-Path -Parent $checkerPython
          try {
            & $checkerPython -c "import shutil; assert shutil.which('git') is None"
            if ($LASTEXITCODE -ne 0) { throw "Git is still available on PATH" }
            & $checkerPython -m pip install "$env:CHECKER_ARCHIVE"
            if ($LASTEXITCODE -ne 0) { throw "Archive installation failed" }
            & $checkerPython -c "from importlib.metadata import version; from pathlib import Path; import tomllib; expected = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; assert version('uw-ne111-checker') == expected"
            if ($LASTEXITCODE -ne 0) { throw "Installed checker version does not match pyproject.toml" }
            & $checkerPython -m ne111_checker --help
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI could not start" }
          } finally {
            $env:PATH = $originalPath
          }
      - name: Run the installed A4 through A9 checkers and regression tests
        shell: pwsh
        run: |
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed" }
          python -m pytest tests/test_inserted_letters.py tests/test_a3_a4_notebook_integration.py tests/test_a5_notebook_integration.py tests/test_a3_a8_integration.py tests/test_a7_integration.py tests/test_a8_integration.py tests/test_a9_integration.py tests/test_whitespace.py tests/test_file_picker.py tests/test_native_file_dialog.py tests/test_student_app.py
          if ($LASTEXITCODE -ne 0) { throw "Checker regression tests failed" }
          python scripts/smoke_a4.py
          if ($LASTEXITCODE -ne 0) { throw "A4 dashboard smoke test failed" }
          python scripts/smoke_a5.py
          if ($LASTEXITCODE -ne 0) { throw "A5 dashboard smoke test failed" }
          python scripts/smoke_a6.py
          if ($LASTEXITCODE -ne 0) { throw "A6 dashboard smoke test failed" }
          python scripts/smoke_a7.py
          if ($LASTEXITCODE -ne 0) { throw "A7 dashboard smoke test failed" }
          python scripts/smoke_function_checker.py A8
          if ($LASTEXITCODE -ne 0) { throw "A8 dashboard smoke test failed" }
          python scripts/smoke_function_checker.py A9
          if ($LASTEXITCODE -ne 0) { throw "A9 dashboard smoke test failed" }
      - name: Exercise the installed Linux native file dialog
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes zenity xvfb xdotool
          xvfb-run --auto-servernum python scripts/smoke_linux_file_dialog.py
